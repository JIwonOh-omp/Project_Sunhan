<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunhan — Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#3D5C34; --accent-dark:#2A3F24; --accent-tint:#E1E8DA;
    --accent-grad: linear-gradient(135deg,#4A6B3F,#263A20);
    --bg:#F4F1EA;
    --card:#FFFFFF;
    --border:#EFEBE2;
    --ink:#3A3A38;
    --ink-soft:#6E6A62;
    --ink-faint:#9A968E;
    --ink-fainter:#B0ABA1;
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:'Manrope',system-ui,sans-serif;
       -webkit-font-smoothing:antialiased;color:var(--ink)}
  a{color:var(--accent);text-decoration:none}

  header.site{padding:28px 24px 18px;display:flex;align-items:baseline;gap:14px;
       max-width:640px;margin:0 auto}
  header.site .wordmark{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;
       font-size:26px;letter-spacing:-.01em;color:var(--accent-dark)}
  header.site .tagline{font-size:13px;color:var(--ink-faint)}

  main{max-width:640px;margin:0 auto;padding:0 20px 110px}

  .tabbar{position:fixed;left:0;right:0;bottom:0;background:#fff;
       border-top:1px solid var(--border);z-index:20}
  .tabbar-inner{max-width:640px;margin:0 auto;display:flex;
       padding:10px 20px calc(10px + env(safe-area-inset-bottom))}
  .tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
       font-size:11px;font-weight:700;color:var(--ink-fainter);text-decoration:none;padding:4px 0}
  .tab-item.active{color:var(--accent)}

  h1.title{margin:14px 0 6px;font-size:26px;font-weight:800;letter-spacing:-.02em;
       color:var(--ink);line-height:1.2}
  p.subtitle{margin:0 0 30px;font-size:14px;line-height:1.5;color:var(--ink-faint)}

  .group{margin:0 0 28px}
  .group-label{font-size:13px;font-weight:700;color:var(--ink-soft);margin:0 0 12px;
       letter-spacing:.01em}
  .group-hint{font-size:12px;color:var(--ink-fainter);margin:-8px 0 12px}

  .chips{display:flex;flex-wrap:wrap;gap:9px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;
       border-radius:22px;font-size:13.5px;font-weight:600;background:var(--card);
       border:1px solid var(--border);color:var(--ink-soft);cursor:pointer;
       user-select:none;transition:background .15s,border-color .15s,color .15s}
  .chip svg{display:none;flex:none}
  .chip.selected{background:var(--accent);border-color:var(--accent);color:#fff;
       font-weight:700;box-shadow:0 4px 12px -3px rgba(61,92,52,.5)}
  .chip.selected svg{display:block}

  .cta-btn{width:100%;border:none;padding:16px;border-radius:16px;background:var(--accent-grad);
       color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;
       box-shadow:0 8px 20px -6px rgba(61,92,52,.5);margin-top:8px}
  .cta-btn:active{opacity:.9}

  .disclaimer{text-align:center;font-size:11.5px;color:var(--ink-fainter);margin:12px 4px 0}
</style>
</head>
<body>

<header class="site">
  <a class="wordmark" href="index.html?show=1">sunhan</a>
  <span class="tagline">K-beauty ingredient translation &amp; safety analysis</span>
</header>

<main>
  <h1 class="title">Tell us about<br>your skin</h1>
  <p class="subtitle">So we can flag what matters to you.</p>

  <div class="group">
    <div class="group-label">Skin type</div>
    <div class="chips" id="skin-type-chips" data-mode="single"></div>
  </div>

  <div class="group">
    <div class="group-label">Allergies &amp; fragrances to avoid</div>
    <div class="group-hint">Select all that apply</div>
    <div class="chips" id="avoid-chips" data-mode="multi"></div>
  </div>

  <div class="group">
    <div class="group-label">Concerns</div>
    <div class="chips" id="concern-chips" data-mode="multi"></div>
  </div>

  <button class="cta-btn" id="continue-btn">Continue</button>
  <p class="disclaimer">We use this only to personalize your ingredient safety checks.</p>
</main>

<nav class="tabbar">
  <div class="tabbar-inner">
    <a href="search.html" class="tab-item">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M3 10.5L12 3l9 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 9.5V20h14V9.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Home</span>
    </a>
    <a href="skin-journey.html" class="tab-item">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 5.5A1.5 1.5 0 015.5 4H11v16H5.5A1.5 1.5 0 014 18.5v-13z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M20 5.5A1.5 1.5 0 0018.5 4H13v16h5.5a1.5 1.5 0 001.5-1.5v-13z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span>Journey</span>
    </a>
    <a href="community.html" class="tab-item">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3" stroke="currentColor" stroke-width="2"/><circle cx="17" cy="9" r="2.4" stroke="currentColor" stroke-width="2"/><path d="M3 19c0-3 2.7-5.2 6-5.2s6 2.2 6 5.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M15.5 14.3c2.5.3 4.5 2 4.5 4.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Community</span>
    </a>
    <a href="profile.html" class="tab-item active">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="2"/><path d="M5 20c0-3.3 3.1-6 7-6s7 2.7 7 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Profile</span>
    </a>
  </div>
</nav>

<script>
const CHECK_ICON = '<svg width="13" height="13" viewBox="0 0 12 12" fill="none"><path d="M2.5 6.3l2.2 2.2L9.5 3.7" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const SKIN_TYPES = ["Dry", "Oily", "Combination", "Sensitive", "Normal"];
const AVOID_OPTIONS = ["Fragrance", "Linalool", "Limonene", "Citral", "Alcohol", "Essential oils"];
const CONCERN_OPTIONS = ["Acne", "Redness", "Dryness", "Pigmentation"];

const state = loadExistingProfile();

function loadExistingProfile() {
  const raw = sessionStorage.getItem("sunhanProfile");
  if (!raw) return { skinType: null, avoidList: new Set(), concerns: new Set() };
  try {
    const parsed = JSON.parse(raw);
    return {
      skinType: parsed.skinType || null,
      avoidList: new Set(Array.isArray(parsed.avoidList) ? parsed.avoidList : []),
      concerns: new Set(Array.isArray(parsed.concerns) ? parsed.concerns : [])
    };
  } catch (e) {
    return { skinType: null, avoidList: new Set(), concerns: new Set() };
  }
}

renderGroup("skin-type-chips", SKIN_TYPES, "single");
renderGroup("avoid-chips", AVOID_OPTIONS, "multi");
renderGroup("concern-chips", CONCERN_OPTIONS, "multi");

function renderGroup(containerId, options, mode) {
  const el = document.getElementById(containerId);
  el.innerHTML = options.map(label => chipHtml(label, mode)).join("");
  el.querySelectorAll(".chip").forEach(chipEl => {
    chipEl.addEventListener("click", () => {
      const label = chipEl.dataset.label;
      if (mode === "single") {
        state.skinType = state.skinType === label ? null : label;
      } else {
        const set = containerId === "avoid-chips" ? state.avoidList : state.concerns;
        if (set.has(label)) set.delete(label); else set.add(label);
      }
      updateChipStyles(containerId, mode);
    });
  });
  updateChipStyles(containerId, mode);
}

function chipHtml(label, mode) {
  return `<span class="chip" data-label="${escapeHtml(label)}">${mode === "multi" ? CHECK_ICON : ""}${escapeHtml(label)}</span>`;
}

function updateChipStyles(containerId, mode) {
  const el = document.getElementById(containerId);
  el.querySelectorAll(".chip").forEach(chipEl => {
    const label = chipEl.dataset.label;
    const isSelected = mode === "single"
      ? state.skinType === label
      : (containerId === "avoid-chips" ? state.avoidList : state.concerns).has(label);
    chipEl.classList.toggle("selected", isSelected);
  });
}

document.getElementById("continue-btn").addEventListener("click", () => {
  const profile = {
    skinType: state.skinType,
    avoidList: [...state.avoidList],
    concerns: [...state.concerns]
  };
  sessionStorage.setItem("sunhanProfile", JSON.stringify(profile));
  window.location.href = "search.html";
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
</script>

</body>
</html>
