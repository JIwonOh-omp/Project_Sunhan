<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
/* ------------------------------------------------------------------
   Returning-visitor bypass: once "Get Started" has been tapped, the
   landing screen doesn't force itself back on every visit — go
   straight to Home instead. Add ?show=1 to the URL (or tap the
   "sunhan" wordmark on any screen, which links here with that param)
   to see the landing screen again, e.g. for a demo.
------------------------------------------------------------------ */
(function () {
  var params = new URLSearchParams(window.location.search);
  if (localStorage.getItem("sunhanVisited") === "true" && !params.has("show")) {
    window.location.replace("search.html");
  }
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunhan — K-beauty Ingredients, Understood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#3D5C34; --accent-dark:#2A3F24; --accent-tint:#E1E8DA;
    --accent-grad: linear-gradient(135deg,#4A6B3F,#263A20);
    --bg:#F4F1EA;
    --card:#FFFFFF;
    --border:#EFEBE2;
    --ink:#3A3A38;
    --ink-soft:#6E6A62;
    --ink-faint:#9A968E;
    --ink-fainter:#B0ABA1;
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:'Manrope',system-ui,sans-serif;
       -webkit-font-smoothing:antialiased;color:var(--ink)}
  a{color:var(--accent);text-decoration:none}

  header.site{padding:28px 24px 0;display:flex;align-items:baseline;gap:14px;
       max-width:640px;margin:0 auto}
  header.site .wordmark{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;
       font-size:26px;letter-spacing:-.01em;color:var(--accent-dark)}

  main.landing{max-width:520px;margin:0 auto;padding:48px 24px 56px;text-align:center}

  .logo-mark{width:76px;height:76px;margin:0 auto 22px;border-radius:22px;
       background:var(--accent-grad);display:flex;align-items:center;justify-content:center;
       box-shadow:0 10px 26px -10px rgba(0,0,0,.3)}

  h1.app-name{margin:0 0 4px;font-family:'Instrument Serif',serif;font-style:italic;
       font-weight:400;font-size:44px;letter-spacing:-.01em;color:var(--accent-dark)}

  p.korean-tagline{margin:0 0 28px;font-size:11px;line-height:1.4;color:var(--ink-soft);
       font-weight:600;letter-spacing:.3em}

  p.value-prop{margin:0 0 40px;font-size:17px;line-height:1.5;color:var(--ink-soft);font-weight:600}

  .feature-list{display:flex;flex-direction:column;gap:20px;text-align:left;margin:0 0 40px}
  .feature-item{display:flex;gap:14px;align-items:flex-start}
  .feature-icon{width:44px;height:44px;flex:none;border-radius:13px;background:var(--accent-tint);
       display:flex;align-items:center;justify-content:center}
  .feature-name{font-size:14.5px;font-weight:800;color:var(--ink);margin:0 0 2px}
  .feature-desc{font-size:13px;line-height:1.45;color:var(--ink-faint)}

  .cta-btn{width:100%;border:none;padding:16px;border-radius:16px;background:var(--accent-grad);
       color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;
       box-shadow:0 8px 20px -6px rgba(61,92,52,.5)}
  .cta-btn:active{opacity:.9}

  .honesty-line{margin:20px 0 0;font-size:11.5px;color:var(--ink-fainter);line-height:1.5}
</style>
</head>
<body>

<header class="site">
  <span class="wordmark">sunhan</span>
</header>

<main class="landing">
  <div class="logo-mark">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.2" stroke="#fff" stroke-width="2"/><path d="M12 2.5v2.6M12 18.9v2.6M21.5 12h-2.6M5.1 12H2.5M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8M18.7 18.7l-1.8-1.8M7.1 7.1L5.3 5.3" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
  </div>

  <h1 class="app-name">sunhan</h1>
  <p class="korean-tagline">순한 · GENTLE</p>

  <!--
    Value proposition — candidates considered:
    (a) "Read any K-beauty label — in your language."
    (b) "Understand what's really in your Korean skincare."   <- SELECTED
    (c) "K-beauty ingredients, decoded for you."
    Swap the <p class="value-prop"> text below to try a different one.
  -->
  <p class="value-prop">Understand what's really in your Korean skincare.</p>

  <div class="feature-list">
    <div class="feature-item">
      <div class="feature-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="var(--accent)" stroke-width="2"/><path d="M3 12h18M12 3c2.5 2.5 4 6 4 9s-1.5 6.5-4 9c-2.5-2.5-4-6-4-9s1.5-6.5 4-9z" stroke="var(--accent)" stroke-width="2"/></svg>
      </div>
      <div>
        <div class="feature-name">Translate</div>
        <div class="feature-desc">Korean ingredients into English (INCI)</div>
      </div>
    </div>
    <div class="feature-item">
      <div class="feature-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 3l7 3v5c0 5-3 8.5-7 10-4-1.5-7-5-7-10V6l7-3z" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/><path d="M9.5 12l2 2 3.5-4" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div>
        <div class="feature-name">Skin alerts</div>
        <div class="feature-desc">Flags ingredients for your skin type &amp; allergens</div>
      </div>
    </div>
    <div class="feature-item">
      <div class="feature-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M20 4c-9 0-16 5-16 14 0 1 .1 1.7.2 2C13 20 20 13 20 4z" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/><path d="M4.5 19.5C9 15 13 11 18 6" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <div>
        <div class="feature-name">Eco flags</div>
        <div class="feature-desc">Reef-harmful &amp; microplastic ingredients</div>
      </div>
    </div>
  </div>

  <button class="cta-btn" id="get-started-btn" type="button">Get Started</button>
  <p class="honesty-line">No product ads. No medical advice. Ingredient info only.</p>
</main>

<script>
document.getElementById("get-started-btn").addEventListener("click", () => {
  localStorage.setItem("sunhanVisited", "true");
  window.location.href = "profile.html";
});
</script>

</body>
</html>
